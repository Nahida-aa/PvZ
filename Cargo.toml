[workspace]
resolver = "3"
members = ["packages/*", "tools/*"]
default-members = ["packages/app"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bevy = { version = "0.19", features = ["jpeg", "system_font_discovery"] }
bevy_ui_widgets = "0.19"
rand = "0.8"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json_comments = "0.2"
